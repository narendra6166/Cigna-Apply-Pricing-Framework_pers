G_TYPE            AS PRICINGTYPE,\r\n    a.P20_GCDOC_CASE_RATE_IND                AS CASERATEIND,\r\n    a.P20_GCDOC_SANP_CLAIM_STATUS            AS STATUS,\r\n    d.P22_GCDOCDET_SANP_CL_APC_NUM           AS APC_NUM,\r\n    d.P22_GCDOCDET_SANP_CL_MAX_UNITS         AS MAX_UNITS,\r\n    d.P22_GCDOCDET_SANP_CL_GRP_CHG           AS GRP_CHG,\r\n    d.P22_GCDOCDET_SANP_CL_ALLOW_CHG         AS ALLOW_CHG,\r\n    d.P22_GCDOCDET_SANP_PD_USAGE             AS USAGE,\r\n    d.P22_GCDOCDET_SANP_PD_RATE_TYP          AS RATETYPE,\r\n    d.P22_GCDOCDET_SANP_BASED_ON_CD          AS BASED_ON\r\nFROM GFRD.P20_GCDOC a\r\nJOIN GFRD.P21_GCDOCPRV b\r\n    ON a.P20_GCDOC_NO = b.P20_GCDOC_NO\r\nLEFT JOIN GFRD.P21_GCDOCPRV_PPO_FEE_DATA c\r\n    ON a.P20_GCDOC_NO = c.P20_GCDOC_NO\r\nJOIN GFRD.P22_GCDOCDET d\r\n    ON a.P20_GCDOC_NO = d.P20_GCDOC_NO\r\n WHERE c.P21_GCDOCPRV_SCHEDULE_ATTR = 'APCOP'\r\n  AND a.P20_GCDOC_SANP_CLAIM_STATUS = '1005'\r\n  AND d.P22_GCDOCDET_SANP_CL_ALLOW_CHG > 0\r\nORDER BY a.CLM_EVENT_TMSTP DESC": [
