# ### OTROP-634 / AP-008 — case rate, no used DRG, usage A/SA
# ```sql
# WHERE a.P20_GCDOC_CASE_RATE_IND = 'Y'
#   AND a.P20_GCDOC_SANP_CLAIM_STATUS = '1005'
