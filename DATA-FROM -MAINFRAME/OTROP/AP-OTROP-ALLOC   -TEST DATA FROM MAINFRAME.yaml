# ### AP-OTROP-ALLOC — case rate GRP vs ALLOW (same style as AP-013)
# ```sql
# WHERE a.P20_GCDOC_CASE_RATE_IND = 'Y'
#   AND a.P20_GCDOC_SANP_CLAIM_STATUS = '1005'
#   AND (a.P20_GCDOC_SANP_USED_DRG = '' OR a.P20_GCDOC_SANP_USED_DRG IS NULL)
#   AND d.P22_GCDOCDET_SANP_CL_GRP_CHG < d.P22_GCDOCDET_SANP_CL_ALLOW_CHG

{
"SELECT\r\n    a.P20_GCDOC_NO,\r\n    a.P20_GCDOC_CLAIM_RECV_DATE              AS REQUESTDATE,\r\n    a.P20_GCDOC_EMP_ID                       AS EMPLOYEESSN,\r\n    a.P12_GCEMPSOC_SUBSCR_PID                AS SUBSCRIBERPID,\r\n    a.P20_GCDOC_PID                          AS PATIENTPID,\r\n    a.P20_GCDOC_PAT_NO                       AS PATIENTSUFFIX,\r\n    a.P11_GCEMPPAT_DOB                       AS PATIENTDOB,\r\n    a.P20_GCDOC_FORM_TYPE_IND                AS FORM_TYPE,\r\n    a.P20_GCDOC_SOC                          AS SOC,\r\n    a.P20_GCDOC_NSI_CLIENT_ID                AS CLIENTID,\r\n    a.P20_GCDOC_NSI_CG_ACT_NUM               AS ACCOUNTNUMBER,\r\n    a.P20_GCDOC_NSI_BENOPT                   AS BENOPT,\r\n    b.P21_GCDOCPRV_ID                        AS PROVIDERTIN,\r\n    b.RNDRNG_PRV_CPF_PRV_ID                  AS RENDERINGCPFID,\r\n    b.BILLG_PRV_CPF_PRV_ID                   AS BILLINGCPFID,\r\n    b.P21_GCDOCPRV_TYPE                      AS RENDERINGPROVIDERTYPE,\r\n    b.P21_GCDOCPRV_PRV_NETWORK_IND           AS PROVIDERNETWORKINDICATOR,\r\n    b.P21_GCDOCPRV_ZIP                       AS ZIPCODE,\r\n    b.P21_GCDOCPRV_NSI_NETWORK_ID            AS NETWORKID,\r\n    b.P21_GCDOCPRV_PPO_ID                    AS CLAIMENGINENETWORKID,\r\n    a.P20_GCDOC_MMM_IND                      AS MMMINDICATOR,\r\n    a.P20_GCDOC_SANP_CLAIM_STATUS            AS CLM_STATUS,\r\n    a.P20_GCDOC_CCN_INDICATOR                AS CCNINDICATOR,\r\n    a.P20_GCDOC_CLASS_TIER_IND               AS CLASS_TIER_IND,\r\n    c.P21_GCDOCPRV_SCHEDULE_ATTR             AS SCHEDULEATTR,\r\n    d.P22_GCDOCDET_SANP_CL_ALLOW_CHG         AS SANP_CL_ALLOW_CHG,\r\n    a.P20_GCDOC_SANP_CLAIM_STATUS            AS CLAIMSTATUS,\r\n    a.P20_GCDOC_SUBMITTED_DRG                AS SUBMITTEDDRG,\r\n    a.P20_GCDOC_SANP_USED_DRG                AS USEDDRG,\r\n    a.P20_GCDOC_SANP_USED_DRG_VER            AS DRGVERSION,\r\n    a.P20_GCDOC_SANP_ERROR_CD                AS ERRORCD,\r\n    a.P20_GCDOC_SANP_PRICING_TYPE            AS PRICINGTYPE,\r\n    a.P20_GCDOC_CASE_RATE_IND                AS CASERATEIND,\r\n    a.P20_GCDOC_SANP_CLAIM_STATUS            AS STATUS,\r\n    d.P22_GCDOCDET_SANP_CL_APC_NUM           AS APC_NUM,\r\n    d.P22_GCDOCDET_SANP_CL_MAX_UNITS         AS MAX_UNITS,\r\n    d.P22_GCDOCDET_SANP_CL_GRP_CHG           AS GRP_CHG,\r\n    d.P22_GCDOCDET_SANP_CL_ALLOW_CHG         AS ALLOW_CHG,\r\n    d.P22_GCDOCDET_SANP_PD_USAGE             AS USAGE,\r\n    d.P22_GCDOCDET_SANP_PD_RATE_TYP          AS RATETYPE,\r\n    d.P22_GCDOCDET_SANP_BASED_ON_CD          AS BASED_ON\r\nFROM GFRD.P20_GCDOC a\r\nJOIN GFRD.P21_GCDOCPRV b\r\n    ON a.P20_GCDOC_NO = b.P20_GCDOC_NO\r\nLEFT JOIN GFRD.P21_GCDOCPRV_PPO_FEE_DATA c\r\n    ON a.P20_GCDOC_NO = c.P20_GCDOC_NO\r\nJOIN GFRD.P22_GCDOCDET d\r\n    ON a.P20_GCDOC_NO = d.P20_GCDOC_NO\r\nWHERE a.P20_GCDOC_CASE_RATE_IND = 'Y'\r\n  AND a.P20_GCDOC_SANP_CLAIM_STATUS = '1005'\r\n  AND (a.P20_GCDOC_SANP_USED_DRG = '' OR a.P20_GCDOC_SANP_USED_DRG IS NULL)\r\n  AND d.P22_GCDOCDET_SANP_CL_GRP_CHG < d.P22_GCDOCDET_SANP_CL_ALLOW_CHG\r\nORDER BY a.CLM_EVENT_TMSTP DESC": [
